<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" role="img" aria-labelledby="title">
  <title id="title">PeaceAI</title>
  <defs>
    <linearGradient id="tile" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14183B"/>
      <stop offset="1" stop-color="#090B24"/>
    </linearGradient>
    <linearGradient id="weave" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D28FF"/>
