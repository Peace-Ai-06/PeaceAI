    <g transform="rotate(35 32 32)"><rect x="13" y="21" width="38" height="22" rx="11" fill="none" stroke="url(#weave)" stroke-width="5"/></g>
    <g transform="rotate(-35 32 32)"><rect x="13" y="21" width="38" height="22" rx="11" fill="none" stroke="#090B24" stroke-width="9"/></g>
    <g transform="rotate(-35 32 32)"><rect x="13" y="21" width="38" height="22" rx="11" fill="none" stroke="url(#weave)" stroke-width="5"/></g>
    <path d="M32 23.2 34.9 29.1 40.8 32 34.9 34.9 32 40.8 29.1 34.9 23.2 32 29.1 29.1Z" fill="#FFFFFF"/>
