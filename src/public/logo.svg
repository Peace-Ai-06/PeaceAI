    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(47 15) rotate(90) scale(13)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".38"/>
