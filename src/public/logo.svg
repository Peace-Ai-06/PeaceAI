<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" role="img" aria-labelledby="title desc">
  <title id="title">PeaceAi</title>
  <desc id="desc">PeaceAi logo with a violet-to-teal spark P mark.</desc>
  <defs>
    <linearGradient id="tile" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B7BFF"/>
      <stop offset=".55" stop-color="#6F8DFF"/>
      <stop offset="1" stop-color="#39D7C4"/>
    </linearGradient>
    <linearGradient id="word" x1="82" y1="8" x2="230" y2="40" gradientUnits="userSpaceOnUse">
